name: Build APK

on:
  push:
    branches:
      - feature/calculator-disguise
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout dadb (included build dependency)
        run: |
          mkdir -p ../external
          # 使用用户的 fork（包含传输优化：移除频繁flush）
          if git clone --depth 1 https://github.com/RideWindOne/dadb.git ../external/dadb 2>/dev/null; then
            echo "Cloned RideWindOne/dadb (with transfer optimization)"
          else
            # 回退到原作者的 fork
            git clone --depth 1 https://github.com/XRSec/dadb.git ../external/dadb
            echo "Cloned XRSec/dadb (fallback)"
          fi
          ls -la ../external/dadb/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Configure Gradle for preview SDK
        run: |
          # 移除本地 JDK 路径
          sed -i '/org.gradle.java.home/d' gradle.properties
          # 启用预览版 SDK 自动下载（API 37 是预览版，需要 canary 频道）
          echo "android.sdk.channel=3" >> gradle.properties
          # 允许 Gradle 自动下载所需的 SDK、build-tools、NDK
          echo "android.builder.sdkDownload=true" >> gradle.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep "^VERSION_NAME=" gradle.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep "^VERSION_CODE=" gradle.properties | cut -d'=' -f2)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "release_tag=$VERSION_NAME-$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "apk_name=Screen-Remote-Calculator-arm64-v8a-${VERSION_NAME}-${VERSION_CODE}.apk" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-remote-calculator-apk
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: "简易计算器伪装版 ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})"
          body: |
            ## Screen-Remote 简易计算器伪装版
            
            - 版本：${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})
            - 分支：${{ github.ref_name }}
            - 编译时间：${{ github.event.head_commit.timestamp || '手动触发' }}
            
            ### 功能
            - 伪装成计算器应用，输入密码进入远控界面
            - 通知监控：实时监控被控端通知
            - 查询通知：手动查询被控端最近消息
            - 屏蔽系统通知：可配置过滤系统服务通知
            
            ### 下载
            点击下方 Assets 中的 APK 文件下载安装。
          files: |
            app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
