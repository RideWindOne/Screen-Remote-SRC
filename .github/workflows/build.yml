name: Build APK

on:
  push:
    branches:
      - feature/calculator-disguise
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Configure Gradle for preview SDK
        run: |
          # 移除本地 JDK 路径
          sed -i '/org.gradle.java.home/d' gradle.properties
          # 启用预览版 SDK 自动下载（API 37 是预览版，需要 canary 频道）
          echo "android.sdk.channel=3" >> gradle.properties
          # 允许 Gradle 自动下载所需的 SDK、build-tools、NDK
          echo "android.builder.sdkDownload=true" >> gradle.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-remote-calculator-apk
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 30
